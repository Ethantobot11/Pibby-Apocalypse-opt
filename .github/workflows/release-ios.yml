name: iOS Release
on: workflow_dispatch
jobs:
  iOS:
     runs-on: macos-13
     steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.5

      - name: Retrieve Cache
        uses: actions/cache@v4
        with:
            path: |
              export/release/ios/haxe
              export/release/ios/obj
            key: ${{ runner.os }}-cache
            

      - name: Install Libraries
        run: |
          haxelib git hxcpp https://github.com/kittycathy233/hxcpp --quiet
          haxelib git lime https://github.com/kittycathy233/lime --quiet
          haxelib install openfl 9.4.1 --quiet
          haxelib git flixel https://github.com/kittycathy233/flixel main --quiet
          haxelib install flixel-tools --quiet
          haxelib install flixel-ui --quiet
          haxelib install flixel-addons 3.0.2 --quiet
          haxelib install tjson --quiet
          haxelib install hxjsonast --quiet
          haxelib install hscript --quiet
          haxelib install hxvlc 2.0.1 --quiet
          haxelib git linc_luajit https://github.com/kittycathy233/linc_luajit --quiet
          haxelib install hxcpp-debug-server --quiet
          haxelib list
        # haxelib run lime rebuild extension-iostools ios -arm64 -final

    # sb 报错666

      # - name: Install MobileVLCKit Framework
        # run: |
          # cd ${{ github.workspace }}/..
          # wget -q https://download.videolan.org/cocoapods/prod/MobileVLCKit-3.5.1-34408b84-e9eceaed.tar.xz
          # tar -xf MobileVLCKit-3.5.1-34408b84-e9eceaed.tar.xz

      - name: Compile
        run: haxelib run lime build ios -nosign -D -final

      # - name: Check Code Signing
        # run: cd export/release/ios/build/Release-iphoneos && codesign -dv *.app

      - name: Make Ipa
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir Payload
          mv *.app Payload
          zip -r Pibby：Apocalypse.ipa Payload

      - name: Upload Artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@main
        with:
          name: iOSBuild
          path: export/release/ios/build/Release-iphoneos/*.ipa
          if-no-files-found: error
